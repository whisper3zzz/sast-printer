name: Deploy

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  SERVICE_NAME: sast-goprint
  REGISTRY_PREFIX: sast
  TAR_FILE_NAME: new_image.tar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=0
          for name in SERVER_HOST SERVER_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} repository secret is required for deployment"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets in GitHub repository settings before running Deploy."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short Git commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.REGISTRY_PREFIX }}/${{ env.SERVICE_NAME }}:latest
            ${{ env.REGISTRY_PREFIX }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}
          outputs: type=docker,dest=./${{ env.TAR_FILE_NAME }}

      - name: Transfer image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.TAR_FILE_NAME }}
          target: "/data/${{ env.SERVICE_NAME }}/"

      - name: Execute Deployment Script on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            SERVICE_DIR="/data/${{ env.SERVICE_NAME }}"
            IMAGE_NAME="${{ env.REGISTRY_PREFIX }}/${{ env.SERVICE_NAME }}"
            TAR_FILE="${{ env.TAR_FILE_NAME }}"
            NEW_VERSION_TAG="${{ steps.vars.outputs.sha_short }}"

            cd ${SERVICE_DIR}

            echo "Deploying version: ${NEW_VERSION_TAG}"

            echo "Loading new image from ${TAR_FILE}..."
            docker load -i ${TAR_FILE}

            echo "Rotating image tags..."
            if docker image inspect "${IMAGE_NAME}:current" >/dev/null 2>&1; then
              if docker image inspect "${IMAGE_NAME}:backup" >/dev/null 2>&1; then
                docker rmi "${IMAGE_NAME}:backup"
              fi
              docker tag "${IMAGE_NAME}:current" "${IMAGE_NAME}:backup"
            else
              echo "No current image found; skipping backup."
            fi

            docker tag "${IMAGE_NAME}:${NEW_VERSION_TAG}" "${IMAGE_NAME}:current"

            echo "Starting service with Docker Compose..."
            docker compose up -d --remove-orphans

            echo "Cleaning temporary files and images..."
            rm ${TAR_FILE}
            docker rmi "${IMAGE_NAME}:latest"
            docker image prune -f

            echo "Deployment succeeded: ${NEW_VERSION_TAG}"
